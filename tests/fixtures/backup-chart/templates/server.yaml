apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-rsdragonwilds
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: rsdragonwilds
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rsdragonwilds
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: rsdragonwilds
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: rsdragonwilds
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [sh, -ec, 'trap "sleep 3; exit" TERM; while :; do sleep 1 & wait $!; done']
          volumeMounts:
            - name: world
              mountPath: /home/steam/rsdw-dedicated
      volumes:
        - name: world
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-rsdragonwilds
