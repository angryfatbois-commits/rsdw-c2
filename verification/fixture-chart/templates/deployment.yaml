apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rsdragonwilds
spec:
  replicas: 1
  selector:
    matchLabels:
      fixture: {{ .Release.Name }}
  template:
    metadata:
      labels:
        fixture: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: rsdragonwilds
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Never
          command: [/bin/sh, -c, "echo lifecycle-fixture-ready; exec httpd -f -p 8080 -h /fixture"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
          volumeMounts:
            - name: fixture
              mountPath: /fixture/api
            - name: token
              mountPath: /run/rsdwapi
              readOnly: true
            - name: data
              mountPath: /home/steam/rsdw-dedicated
          env:
            - name: RSDW_ADDITIONAL_ARGS
              value: {{ .Values.server.env.RSDW_ADDITIONAL_ARGS | quote }}
          resources:
            requests:
              memory: 8Mi
              cpu: 1m
            limits:
              memory: 32Mi
              cpu: 50m
      volumes:
        - name: fixture
          configMap:
            name: {{ .Release.Name }}-fixture
        - name: token
          secret:
            secretName: {{ .Values.api.bearerTokenSecret.name }}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-fixture
data:
  health: '{"engineReady":true,"uptimeSeconds":120}'
  players: '{"count":2,"players":[]}'
