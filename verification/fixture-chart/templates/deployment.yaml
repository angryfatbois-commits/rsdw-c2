{{- $seed := .Values.saveSeed | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rsdragonwilds
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      fixture: {{ .Release.Name }}
  template:
    metadata:
      labels:
        fixture: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: rsdragonwilds
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      {{- if $seed.existingClaim }}
      initContainers:
        - name: import-save
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Never
          command: [bash, /fixture-import/seed-save.sh]
          args: [/seed, {{ $seed.path | quote }}, /home/steam/rsdw-dedicated/RSDragonwilds/Saved/SaveGames]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /home/steam/rsdw-dedicated}
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: import-script, mountPath: /fixture-import, readOnly: true}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Never
          command: [/bin/sh, -c, "echo lifecycle-fixture-ready; exec httpd -f -p 8080 -h /fixture"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
          volumeMounts:
            - name: fixture
              mountPath: /fixture/api
            - name: token
              mountPath: /run/rsdwapi
              readOnly: true
            - name: data
              mountPath: /home/steam/rsdw-dedicated
          env:
            - name: RSDW_ADDITIONAL_ARGS
              value: {{ .Values.server.env.RSDW_ADDITIONAL_ARGS | quote }}
          resources:
            requests:
              memory: 8Mi
              cpu: 1m
            limits:
              memory: 32Mi
              cpu: 50m
      volumes:
        - name: fixture
          configMap:
            name: {{ .Release.Name }}-fixture
        - name: token
          secret:
            secretName: {{ .Values.api.bearerTokenSecret.name }}
        - name: data
          {{- if $seed.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-world
        - name: seed
          persistentVolumeClaim:
            claimName: {{ $seed.existingClaim }}
            readOnly: true
        - name: import-script
          configMap:
            name: {{ .Release.Name }}-fixture
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-fixture
data:
  seed-save.sh: |
    {{- .Files.Get "files/seed-save.sh" | nindent 4 }}
  health: '{"engineReady":true,"uptimeSeconds":120}'
  players: '{"count":2,"players":[]}'
{{- if $seed.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-world
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
{{- end }}
