image:
  repository: ghcr.io/petzkod5/rsdw-c2
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

memoryPressure:
  enabled: false
  thresholdPercent: 85
  duration: 10m

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts:
    - rsdw-c2.local
  paths:
    - path: /
      pathType: Prefix
  tls: []

cluster:
  name: local-cluster
  region: eu-central

auth:
  mode: token
  adminTokenSecret:
    name: ""
    key: token
  oidc:
    issuer: ""
    publicOrigin: ""
    clientID: ""
    clientSecret:
      name: ""
      key: client-secret
    scopes: [openid, profile]
    groupsClaim: groups
    rolePolicy:
      adminSubjects: []
      viewerSubjects: []
      adminGroups: []
      viewerGroups: []

state:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: null

backups:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: null
  path: /var/lib/rsdw-c2/backups
  maxRepositoryBytes: 9663676416
  maxItemBytes: 33554432
  maxBundleBytes: 268435456

rbac:
  create: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
